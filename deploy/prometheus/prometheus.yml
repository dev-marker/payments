# Every five seconds, for a lively demo. Fifteen to thirty is more usual.
global:
  scrape_interval: 5s

scrape_configs:
  # Our services, on the host. The gateway's metrics have a port of their own.
  - job_name: payments
    static_configs:
      - targets: ["host.docker.internal:9080"]
        labels: {service: gateway}
      - targets: ["host.docker.internal:8081"]
        labels: {service: wallet}
      - targets: ["host.docker.internal:8082"]
        labels: {service: auth}
      - targets: ["host.docker.internal:8083"]
        labels: {service: transfer}
      - targets: ["host.docker.internal:8084"]
        labels: {service: notification}
      - targets: ["host.docker.internal:8085"]
        labels: {service: webhook}
