version: "2"
sql:
  - engine: postgresql
    schema: db/wallet/migrations
    queries: db/wallet/queries
    gen:
      go:
        package: walletdb
        out: internal/wallet/walletdb
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        emit_enum_valid_method: true
        overrides: &overrides
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          # Trace context columns come out as OpenTelemetry's own carrier.
          - column: "*.trace_context"
            go_type: go.opentelemetry.io/otel/propagation.MapCarrier
  - engine: postgresql
    schema: db/auth/migrations
    queries: db/auth/queries
    gen:
      go:
        package: authdb
        out: internal/auth/authdb
        sql_package: pgx/v5
        overrides: *overrides
  - engine: postgresql
    schema: db/transfer/migrations
    queries: db/transfer/queries
    gen:
      go:
        package: transferdb
        out: internal/transfer/transferdb
        sql_package: pgx/v5
        overrides: *overrides
  - engine: postgresql
    schema: db/notification/migrations
    queries: db/notification/queries
    gen:
      go:
        package: notificationdb
        out: internal/notification/notificationdb
        sql_package: pgx/v5
        overrides: *overrides
