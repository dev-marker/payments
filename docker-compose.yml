services:
  postgres:
    image: postgres:17-alpine
    container_name: payments-postgres
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: payments-redis
    ports:
      - "6379:6379"

  nats:
    image: nats:2.11-alpine
    container_name: payments-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  # Catches every email we send, in development. Its inbox: localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: payments-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  # Traces: OTLP comes in on 4317 (gRPC) and 4318 (HTTP), and the UI is on
  # 16686. It keeps traces in memory, which is plenty for development.
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    container_name: payments-jaeger
    ports:
      - "4317:4317"
      - "4318:4318"
      - "16686:16686"

  # Metrics: it scrapes every service's /metrics. Its UI is on 9090.
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: payments-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    # Our services run on the host, outside Docker. Docker Desktop knows
    # this name; on Linux, it needs this line.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Dashboards, on port 3000. Its data sources and dashboards come from
  # files, so nothing is ever clicked together by hand.
  grafana:
    image: grafana/grafana:13.2.6
    container_name: payments-grafana
    environment:
      # Development only: no login, and everyone is an admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  pgdata:
